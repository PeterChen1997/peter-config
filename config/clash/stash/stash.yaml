# Stash 主配置模板 —— 与家里 OpenClash 共用同一批 GitHub 规则集（详见 README.md）
#
# 这是公开模板，不含任何凭据：
#   - EQUALVPN_SUB_URL 是占位符
#   - 家里自建的住宅出口节点不写在这里
# 生成手机可用的完整配置：
#   python3 config/clash/stash/build_stash.py
# 它从本机 Git 忽略的 inno/ 目录读取订阅链接和私有节点，输出到 inno/stash/。
#
# 策略组：
#   住宅节点  → 私有住宅出口（生成时插到最前）+ EqualVPN 住宅；AI、开发工具、国外兜底都走这里
#   大流量    → EqualVPN 娱乐节点自动选优（视频 / 社交 / 大文件下载）

mode: rule
log-level: info

dns:
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-filter:
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "lens.l.google.com"
    - "*.n.n.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "*.msftncsi.com"
    - "*.msftconnecttest.com"

proxy-providers:
  equalvpn:
    type: http
    url: "EQUALVPN_SUB_URL"
    interval: 43200
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  # EqualVPN 订阅里的静态住宅节点
  - name: "EqualVPN住宅"
    type: select
    use:
      - equalvpn
    filter: "住宅|静态"

  # 住宅出口：build_stash.py 会把私有住宅节点插到最前面，成为默认选项
  - name: "住宅节点"
    type: select
    proxies:
      - "EqualVPN住宅"

  # 风控敏感（OpenAI / Claude / Gemini 等）+ 开发工具 + 国外兜底
  - name: "AI 专线"
    type: select
    proxies:
      - "住宅节点"

  # 流量大户：自动测速选优，只用便宜节点
  - name: "大流量自动"
    type: url-test
    use:
      - equalvpn
    filter: "娱乐"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 流量大户：默认跟随自动选优，便宜节点都不可用时可手动切到 AI 专线
  - name: "大流量"
    type: select
    proxies:
      - "大流量自动"
      - "AI 专线"
    use:
      - equalvpn
    filter: "娱乐"

  # 未命中任何规则的国外流量，默认住宅（质量优先）
  - name: "国外兜底"
    type: select
    proxies:
      - "AI 专线"
      - "大流量"

rule-providers:
  # 本仓库自维护
